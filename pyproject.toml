[tool.ruff]
target-version = "py310"
# notebooks, poster dirs, and results/ contain generated/downloaded artifacts,
# not project source — the agent-written audit scripts live in papers/*/results/.
# meccog/resources is vendored challenge code (validator/template) — must not
# diverge from the official files.
extend-exclude = ["notebooks", ".venv", "venv", "papers/*/poster", "papers/*/results",
                  "meccog/resources"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
  "RUF", # ruff-specific
]
ignore = [
  "E501",  # line too long (formatter handles)
  "T20",   # allow print() — reproductions print a lot of progress output
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T20"]
"papers/*/reproduce.py" = ["T20", "B007"]
# slide copy intentionally uses ν / − / – / × for presentation text
"scripts/deck_content.py" = ["RUF001", "RUF003"]
"scripts/make_submission_deck.py" = ["RUF001"]
"scripts/google_auth_flow.py" = ["RUF001"]
"scripts/gen_deck_art.py" = ["RUF001"]
# figure labels use ν / ≈ / – deliberately (presentation text)
"scripts/make_beam_figures.py" = ["RUF001"]
# meccog scripts map curly quotes/dashes onto ASCII — the unicode is the point
"scripts/meccog_extract.py" = ["RUF001"]
"scripts/meccog_build_sheet.py" = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint.isort]
known-first-party = ["lemma", "lemma_pipeline"]
