[tool.ruff]
target-version = "py310"
# notebooks, poster dirs, and results/ contain generated/downloaded artifacts,
# not project source — the agent-written audit scripts live in papers/*/results/.
extend-exclude = ["notebooks", ".venv", "venv", "papers/*/poster", "papers/*/results"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
  "RUF", # ruff-specific
]
ignore = [
  "E501",  # line too long (formatter handles)
  "T20",   # allow print() — reproductions print a lot of progress output
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T20"]
"papers/*/reproduce.py" = ["T20", "B007"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint.isort]
known-first-party = ["lemma"]
